name: Agentic CI/CD Control Plane Demo

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-agentic-control-plane:
    name: Validate Agentic CI/CD Platform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run sample PR-to-dev pipeline in dry-run mode
        run: |
          python -m agentic_cicd.cli events simulate-pr \
            --repo-path samples/python_app \
            --merged \
            --dry-run \
            --report reports/github_actions_pr_demo.html \
            --json > reports/github_actions_pr_demo.json

      - name: Upload agentic pipeline report
        uses: actions/upload-artifact@v4
        with:
          name: agentic-cicd-report
          path: |
            reports/github_actions_pr_demo.html
            reports/github_actions_pr_demo.json
