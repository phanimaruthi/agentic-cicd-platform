services:
  control-plane:
    image: python:3.13-slim
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: python -m agentic_cicd.cli discover . --json
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-not_configured}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/control-plane.db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GRAPH_DB_URL: ${GRAPH_DB_URL:-memory://local}
      VECTOR_DB_URL: ${VECTOR_DB_URL:-local://documents}
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
